<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoShare - Seguimiento Privado</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f5f7fa; color: #333; }
    .cabecera { background: #1a73e8; color: white; padding: 12px; text-align: center; font-size: 20px; font-weight: bold; }
    .caja-principal { display: flex; flex-direction: column; height: calc(100vh - 50px); }
    .panel-control { background: white; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .fila { margin-bottom: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
    input { flex: 1; min-width: 180px; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; }
    button { padding: 10px 18px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-azul { background: #1a73e8; color: white; }
    .btn-azul:hover { background: #1557b0; }
    .btn-verde { background: #28a745; color: white; }
    .btn-verde:hover { background: #218838; }
    .btn-rojo { background: #dc3545; color: white; font-size: 17px; padding: 12px 20px; }
    .btn-rojo:hover { background: #c82333; }
    #mapa { flex: 1; width: 100%; }
    .mensaje { margin-top: 8px; padding: 8px; border-radius: 4px; display: none; }
    .correcto { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .alerta { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

<div class="cabecera">🛰️ GeoShare - Seguimiento Privado</div>

<div class="caja-principal">
  <div class="panel-control">
    <div class="fila">
      <input type="text" id="nombre" placeholder="Tu nombre">
      <input type="text" id="codigo-grupo" placeholder="Código del grupo">
    </div>
    <div class="fila">
      <button class="btn-azul" id="btn-crear">Crear Grupo</button>
      <button class="btn-verde" id="btn-entrar">Entrar al Grupo</button>
      <button class="btn-rojo" id="btn-sos" style="margin-left: auto;">🚨 ENVIAR SOS</button>
    </div>
    <div id="mensaje" class="mensaje"></div>
  </div>

  <div id="mapa"></div>
</div>

<script>
  const socket = io();
  let mapa, miUbicacion = null, grupoActivo = null;

  // Iniciar mapa
  mapa = L.map('mapa').setView([-34.6037, -58.3816], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);

  // Obtener ubicación automática
  if (navigator.geolocation) {
    navigator.geolocation.watchPosition(posicion => {
      miUbicacion = {
        lat: posicion.coords.latitude,
        lng: posicion.coords.longitude
      };
      mapa.setView([miUbicacion.lat, miUbicacion.lng], 15);
    }, error => {
      mostrarMensaje("No se pudo obtener tu ubicación", "alerta");
    });
  }

  // Botones
  document.getElementById('btn-crear').addEventListener('click', () => {
    const nombre = document.getElementById('nombre').value.trim();
    const codigo = document.getElementById('codigo-grupo').value.trim();
    if (!nombre || !codigo) return mostrarMensaje("Escribe tu nombre y un código", "alerta");
    socket.emit('crear-grupo', { nombre, grupo: codigo });
  });

  document.getElementById('btn-entrar').addEventListener('click', () => {
    const nombre = document.getElementById('nombre').value.trim();
    const codigo = document.getElementById('codigo-grupo').value.trim();
    if (!nombre || !codigo) return mostrarMensaje("Escribe tu nombre y el código del grupo", "alerta");
    socket.emit('entrar-grupo', { nombre, grupo: codigo });
  });

  document.getElementById('btn-sos').addEventListener('click', () => {
    if (!grupoActivo || !miUbicacion) return mostrarMensaje("Primero entra a un grupo y activa tu ubicación", "alerta");
    socket.emit('sos', { grupo: grupoActivo, ...miUbicacion });
    mostrarMensaje("Alerta SOS enviada", "correcto");
  });

  // Eventos del servidor
  socket.on('grupo-creado', (codigo) => {
    grupoActivo = codigo;
    mostrarMensaje(`Grupo creado con éxito: ${codigo}`, "correcto");
  });

  socket.on('entrada-ok', (codigo) => {
    grupoActivo = codigo;
    mostrarMensaje(`Entraste al grupo: ${codigo}`, "correcto");
  });

  socket.on('error', (mensaje) => {
    mostrarMensaje(mensaje, "alerta");
  });

  socket.on('nueva-ubicacion', (datos) => {
    L.marker([datos.lat, datos.lng]).addTo(mapa).bindPopup(datos.nombre || "Ubicación");
  });

  socket.on('alerta-sos', (datos) => {
    L.marker([datos.lat, datos.lng], {icon: L.icon({iconUrl:'https://cdn-icons-png.flaticon.com/512/1828/1828665.png', iconSize:[32,32]})}).addTo(mapa).bindPopup("🚨 ALERTA SOS").openPopup();
    alert("¡Alerta SOS recibida!");
  });

  function mostrarMensaje(texto, tipo) {
    const caja = document.getElementById('mensaje');
    caja.textContent = texto;
    caja.className = `mensaje ${tipo}`;
    caja.style.display = 'block';
    setTimeout(() => caja.style.display = 'none', 4000);
  }
</script>
</body>
</html>
