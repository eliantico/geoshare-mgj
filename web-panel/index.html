<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoShare - Seguimiento Privado</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f5f7fa; }
    .cabecera { background: #1a73e8; color: white; padding: 15px; text-align: center; font-size: 22px; font-weight: bold; }
    .panel { background: white; padding: 15px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; }
    input { padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; min-width: 200px; }
    button { padding: 12px 20px; font-size: 16px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; }
    .azul { background: #1a73e8; color: white; }
    .verde { background: #28a745; color: white; }
    .rojo { background: #dc3545; color: white; font-size: 18px; padding: 15px 25px; }
    #mapa { width: 100%; height: calc(100vh - 200px); }
    .mensaje { padding: 10px; text-align: center; display: none; font-weight: bold; }
    .bien { background: #d4edda; color: #155724; }
    .mal { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

<div class="cabecera">🛰️ GeoShare - Seguimiento Privado</div>

<div class="panel">
  <input type="text" id="nombre" placeholder="Tu nombre">
  <input type="text" id="codigo" placeholder="Código del grupo">
  <button class="azul" id="btnCrear">Crear Grupo</button>
  <button class="verde" id="btnEntrar">Entrar al Grupo</button>
  <button class="rojo" id="btnSOS">🚨 ENVIAR SOS</button>
</div>
<div id="mensaje" class="mensaje"></div>

<div id="mapa"></div>

<script>
  const socket = io();
  let mapa, miUbicacion = null, miPunto = null, grupoActivo = null;

  // Iniciar mapa
  mapa = L.map('mapa').setView([-34.6037, -58.3816], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);

  // Obtener y mostrar ubicación
  function activarUbicacion() {
    if (!navigator.geolocation) return mostrarMensaje("No hay ubicación", "mal");
    
    navigator.geolocation.watchPosition(
      (pos) => {
        miUbicacion = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        mapa.setView([miUbicacion.lat, miUbicacion.lng], 16);
        
        // Dibujar o mover tu punto
        if (!miPunto) {
          miPunto = L.marker([miUbicacion.lat, miUbicacion.lng], {
            icon: L.icon({iconUrl:'https://cdn-icons-png.flaticon.com/512/684/684908.png', iconSize:[32,32]})
          }).addTo(mapa).bindPopup("Tú 📍").openPopup();
        } else {
          miPunto.setLatLng([miUbicacion.lat, miUbicacion.lng]);
        }

        // Enviar a grupo si estás dentro
        if (grupoActivo) {
          socket.emit('ubicacion', {
            grupo: grupoActivo,
            nombre: document.getElementById('nombre').value.trim(),
            lat: miUbicacion.lat,
            lng: miUbicacion.lng
          });
        }
      },
      (err) => mostrarMensaje("Permite la ubicación para usar el sistema", "mal"),
      { enableHighAccuracy: true }
    );
  }

  // Botones
  document.getElementById('btnCrear').addEventListener('click', () => {
    const nom = document.getElementById('nombre').value.trim();
    const cod = document.getElementById('codigo').value.trim();
    if (!nom || !cod) return mostrarMensaje("Completa nombre y código", "mal");
    activarUbicacion();
    socket.emit('crear-grupo', { nombre: nom, grupo: cod });
  });

  document.getElementById('btnEntrar').addEventListener('click', () => {
    const nom = document.getElementById('nombre').value.trim();
    const cod = document.getElementById('codigo').value.trim();
    if (!nom || !cod) return mostrarMensaje("Completa nombre y código", "mal");
    activarUbicacion();
    socket.emit('entrar-grupo', { nombre: nom, grupo: cod });
  });

  document.getElementById('btnSOS').addEventListener('click', () => {
    if (!grupoActivo || !miUbicacion) return mostrarMensaje("Primero entra a un grupo", "mal");
    socket.emit('sos', { grupo: grupoActivo, ...miUbicacion });
    mostrarMensaje("Alerta SOS enviada", "bien");
  });

  // Respuestas del servidor
  socket.on('grupo-creado', (cod) => {
    grupoActivo = cod;
    mostrarMensaje(`✅ Grupo creado: ${cod} - Compártelo con quien quieras`, "bien");
  });

  socket.on('entrada-ok', (cod) => {
    grupoActivo = cod;
    mostrarMensaje(`✅ Entraste al grupo: ${cod}`, "bien");
  });

  socket.on('error', (txt) => mostrarMensaje(txt, "mal"));

  socket.on('nueva-ubicacion', (datos) => {
    if (datos.nombre === document.getElementById('nombre').value.trim()) return;
    L.marker([datos.lat, datos.lng]).addTo(mapa).bindPopup(datos.nombre);
  });

  socket.on('alerta-sos', (datos) => {
    L.marker([datos.lat, datos.lng], {icon: L.icon({iconUrl:'https://cdn-icons-png.flaticon.com/512/1828/1828665.png', iconSize:[32,32]})}).addTo(mapa).bindPopup("🚨 SOS").openPopup();
    alert("¡ALERTA RECIBIDA!");
  });

  function mostrarMensaje(texto, tipo) {
    const caja = document.getElementById('mensaje');
    caja.textContent = texto;
    caja.className = `mensaje ${tipo}`;
    caja.style.display = 'block';
    setTimeout(() => caja.style.display = 'none', 5000);
  }
</script>
</body>
</html>
